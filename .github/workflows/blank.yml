name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        run: |
          # Case 1: project files were uploaded directly
          FOUND=$(find . -name settings.gradle -not -path './proj/*' | head -n 1)
          # Case 2: project was uploaded as a zip
          if [ -z "$FOUND" ]; then
            mkdir -p proj
            i=0
            for z in *.zip; do
              i=$((i+1))
              mkdir -p "proj/$i"
              unzip -q -o "$z" -d "proj/$i" || true
            done
            FOUND=$(find proj -name settings.gradle | head -n 1)
          fi
          if [ -z "$FOUND" ]; then
            echo "No Android project found in this repo."
            ls -la
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FOUND")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: UltraUpscaler-apk
          path: app-debug.apk
